<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HERMES // DEPLOY TEST</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&family=Noto+Sans+KR:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root { --c:#22d3ee; --g:#34d399; --bg:#04070d; --t:#cfe9f3; --d:#5d7b8c; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:
    radial-gradient(800px 500px at 50% 30%, rgba(34,211,238,.10), transparent 60%), var(--bg);
    color:var(--t); font-family: "JetBrains Mono", "Noto Sans KR", ui-monospace, SFMono-Regular, Menlo, Consolas, "Malgun Gothic", "Apple SD Gothic Neo", monospace; }
  body::after { content:""; position:fixed; inset:0; pointer-events:none;
    background: repeating-linear-gradient(to bottom, transparent 0 2px, rgba(34,211,238,.03) 3px 4px); }
  .card { width:min(92vw,560px); border:1px solid rgba(56,189,248,.3); padding:28px 26px; background:rgba(9,16,28,.85); position:relative; }
  .card::before { content:""; position:absolute; top:-1px; left:-1px; width:18px; height:18px; border-top:2px solid var(--c); border-left:2px solid var(--c); }
  h1 { margin:0 0 6px; font-size:22px; letter-spacing:.14em; color:#eafcff; }
  h1 b { color:var(--c); }
  .sub { color:var(--d); font-size:12px; letter-spacing:.2em; margin-bottom:22px; }
  .row { display:flex; justify-content:space-between; border-bottom:1px dashed rgba(56,189,248,.15); padding:9px 0; font-size:14px; }
  .row span:last-child { color:var(--c); }
  .ok { color:var(--g)!important; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; background:var(--g); box-shadow:0 0 10px var(--g); margin-right:8px; animation:b 1.2s infinite; }
  @keyframes b { 50% { opacity:.35; } }
  .msg { margin-top:22px; font-size:15px; line-height:1.6; }
  .cur { color:var(--c); animation:b 1s steps(2) infinite; }
</style>
</head>
<body>
  <main class="card">
    <h1>HERMES<b>://</b>DEPLOY</h1>
    <div class="sub">AUTONOMOUS AGENT · DEPLOYMENT TEST</div>
    <div class="row"><span>STATUS</span><span class="ok"><i class="dot"></i>ONLINE</span></div>
    <div class="row"><span>BUILT BY</span><span>Hermes Agent (AI)</span></div>
    <div class="row"><span>PIPELINE</span><span>write → git push → GitHub Pages</span></div>
    <div class="row"><span>DEPLOYED</span><span>2026-10-30 01:38 KST</span></div>
    <div class="row"><span>YOUR TIME</span><span id="now">—</span></div>
    <p class="msg">이 페이지는 사람이 아니라 <b style="color:var(--c)">AI 에이전트</b>가 직접 코드를 쓰고, 인터넷에 올렸습니다.<span class="cur">▋</span></p>
  </main>
<script>
  function t(){ document.getElementById('now').textContent = new Date().toLocaleTimeString('ko-KR', {hour12:false}); }
  t(); setInterval(t, 1000);
</script>
</body>
</html>
